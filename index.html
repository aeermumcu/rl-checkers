<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Checkers - Master the Board</title>
    <meta name="description" content="Play checkers against an AI trained with deep reinforcement learning. Beautiful interface with multiple difficulty levels.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- TensorFlow.js -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="game-header">
            <div class="logo">
                <span class="logo-icon">♔</span>
                <h1>AI Checkers</h1>
            </div>
            <div class="header-controls">
                <button id="theme-toggle" class="icon-btn" title="Toggle theme">
                    <span class="theme-icon">🌙</span>
                </button>
                <button id="sound-toggle" class="icon-btn" title="Toggle sound">
                    <span class="sound-icon">🔊</span>
                </button>
            </div>
        </header>

        <!-- Main Game Area -->
        <main class="game-main">
            <!-- Game Info Panel (Left) -->
            <aside class="game-panel left-panel">
                <div class="panel-card player-card ai-player">
                    <div class="player-avatar">🤖</div>
                    <div class="player-info">
                        <span class="player-name">AI Opponent</span>
                        <span class="player-pieces" id="ai-pieces">12 pieces</span>
                    </div>
                    <div class="thinking-indicator" id="ai-thinking">
                        <div class="thinking-dot"></div>
                        <div class="thinking-dot"></div>
                        <div class="thinking-dot"></div>
                    </div>
                </div>

                <div class="panel-card difficulty-card">
                    <h3>Difficulty</h3>
                    <div class="difficulty-selector">
                        <button class="diff-btn" data-level="easy">Easy</button>
                        <button class="diff-btn active" data-level="medium">Medium</button>
                        <button class="diff-btn" data-level="hard">Hard</button>
                        <button class="diff-btn" data-level="impossible">Impossible</button>
                    </div>
                </div>

                <div class="panel-card player-card human-player">
                    <div class="player-avatar">👤</div>
                    <div class="player-info">
                        <span class="player-name">You</span>
                        <span class="player-pieces" id="human-pieces">12 pieces</span>
                    </div>
                    <div class="turn-indicator" id="your-turn">Your Turn</div>
                </div>
            </aside>

            <!-- Game Board (Center) -->
            <div class="board-container">
                <div class="board-frame">
                    <div class="board" id="game-board">
                        <!-- Board squares generated by JavaScript -->
                    </div>
                </div>
                
                <div class="game-controls">
                    <button id="new-game-btn" class="primary-btn">
                        <span>🎮</span> New Game
                    </button>
                    <button id="undo-btn" class="secondary-btn" disabled>
                        <span>↩️</span> Undo
                    </button>
                    <button id="hint-btn" class="secondary-btn">
                        <span>💡</span> Hint
                    </button>
                </div>
            </div>

            <!-- Move History Panel (Right) -->
            <aside class="game-panel right-panel">
                <div class="panel-card history-card">
                    <h3>Move History</h3>
                    <div class="move-list" id="move-list">
                        <div class="move-placeholder">Game moves will appear here...</div>
                    </div>
                </div>

                <div class="panel-card stats-card">
                    <h3>Statistics</h3>
                    <div class="stat-row">
                        <span>Games Played</span>
                        <span id="stat-games">0</span>
                    </div>
                    <div class="stat-row">
                        <span>Wins</span>
                        <span id="stat-wins">0</span>
                    </div>
                    <div class="stat-row">
                        <span>Win Rate</span>
                        <span id="stat-rate">0%</span>
                    </div>
                </div>
            </aside>
        </main>

        <!-- Game Over Modal -->
        <div class="modal-overlay" id="game-over-modal">
            <div class="modal-content">
                <div class="modal-icon" id="modal-icon">🏆</div>
                <h2 id="modal-title">Victory!</h2>
                <p id="modal-message">Congratulations! You beat the AI!</p>
                <div class="modal-buttons">
                    <button id="play-again-btn" class="primary-btn">Play Again</button>
                    <button id="change-difficulty-btn" class="secondary-btn">Change Difficulty</button>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div class="loading-overlay" id="loading-overlay">
            <div class="loader">
                <div class="loader-piece"></div>
                <div class="loader-piece"></div>
            </div>
            <p>Loading AI Model...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/game.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
